{{- range $key, $secret := .Values.extraResources.secrets }}
{{- if and (not $secret.data) (not $secret.stringData) }}
{{- fail (printf "secret %q must define at least one of `data` or `stringData`" $key) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name | default $key }}
  {{- with $secret.namespace }}
  namespace: {{ . }}
  {{- end }}
type: {{ $secret.type | default "Opaque" }}
{{- if $secret.immutable }}
immutable: true
{{- end }}
{{- with $secret.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $secret.stringData }}
stringData:
  {{- if $secret.tpl }}
  {{- range $k, $v := . }}
  {{ $k }}: {{ tpl (toString $v) $ | quote }}
  {{- end }}
  {{- else }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
